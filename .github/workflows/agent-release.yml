name: Build the agent (Release)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: pwsh
        run: |
          ./tools/publish-agent.ps1
          ./tools/publish-agent.ps1 -SelfContained
      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RboxAgent.zip
            dist/RboxAgent-selfcontained.zip
